plugins { id 'com.android.application' }
def managed = providers.gradleProperty('continuumManaged').getOrElse('false') == 'true'
def targetAbi = providers.gradleProperty('targetAbi').getOrElse('arm64-v8a')
def supportedAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']
def targetAbis = targetAbi == 'universal' ? supportedAbis : [targetAbi]
if (!supportedAbis.containsAll(targetAbis)) throw new GradleException('Unsupported target ABI')
def rustTask = tasks.register('buildRustCore', Exec) {
    workingDir rootDir
    commandLine 'bash', 'scripts/build-rust.sh', targetAbi
}
android {
    namespace 'app.continuum'
    compileSdk 35
    defaultConfig {
        applicationId managed ? 'app.continuum' : 'app.nyx.vpn'
        minSdk 26
        targetSdk 35
        versionCode managed ? 100 : 6
        versionName managed ? '1.0.0-open-beta' : '0.6.0-candidate'
        buildConfigField 'boolean', 'BETA_POOL', managed.toString()
        buildConfigField 'boolean', 'MANAGED_UI', managed.toString()
        buildConfigField 'boolean', 'MANAGED_ONLY', 'false'
        resValue 'bool', 'developer_screens', 'true'
        ndk { abiFilters.addAll(targetAbis) }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'BUILD_ABI', '"' + targetAbi + '"'
    }
    if (managed) { sourceSets.main.manifest.srcFile 'src/continuum/AndroidManifest.xml' }
    buildFeatures { buildConfig true }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Direct, page-aligned loading avoids native-library extraction at install.
    packaging { jniLibs { useLegacyPackaging false } }
    testOptions { unitTests.all { dependsOn rustTask; jvmArgs "-Djava.library.path=${rootDir}/rust-core/target/release" } }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
        if (System.getenv('CONTINUUM_KEYSTORE_PATH')) {
            stable {
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
                storeFile file(System.getenv('CONTINUUM_KEYSTORE_PATH'))
                storePassword System.getenv('CONTINUUM_STORE_PASSWORD')
                keyAlias System.getenv('CONTINUUM_KEY_ALIAS')
                keyPassword System.getenv('CONTINUUM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            buildConfigField 'boolean', 'MANAGED_ONLY', managed.toString()
            resValue 'bool', 'developer_screens', (!managed).toString()
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('CONTINUUM_KEYSTORE_PATH') ? signingConfigs.stable : signingConfigs.debug
        }
    }
}
// Debug-only engine fixtures retain their existing isolated package identity.
// The shipped managed release always uses app.continuum and enforces its policy.
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        if (managed) variant.applicationId.set('app.nyx.vpn')
    }
}
tasks.named('preBuild').configure { dependsOn rustTask }
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('libs/libv2ray.aar')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
