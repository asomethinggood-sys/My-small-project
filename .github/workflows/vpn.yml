name: VPN Loop

# Optional legacy experiment. Set ENABLE_FREE_TUNNEL=true to run.
# Handover changes the endpoint and interrupts sessions; not seamless uptime.

on:
  workflow_dispatch:
  schedule:
    - cron: "21 */5 * * *"
  repository_dispatch:
    types: [vpn-loop]

permissions:
  actions: write
  contents: write

concurrency:
  group: vpn-loop-${{ github.ref }}
  # A repository_dispatch "kick" cancels whatever runs/pends and restarts the
  # loop fresh (emergency reset). All other events queue politely and take
  # over when the current run finishes -> the self-chaining handover.
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

jobs:
  tunnel:
    if: vars.ENABLE_FREE_TUNNEL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      # ---------------------------------------------------------------
      # 1. Queue the NEXT run before anything else -> pending handover.
      # ---------------------------------------------------------------
      - name: Queue the next run (self-chaining loop)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run vpn.yml --ref "$WORKFLOW_REF"; then
              echo "Next run queued (attempt ${attempt})."
              exit 0
            fi
            echo "Dispatch failed (attempt ${attempt}), retrying in 20s..."
            sleep 20
          done
          echo "::warning::Could not queue the next run; the cron schedule will revive the loop."

      # ---------------------------------------------------------------
      # 2. Install Xray-core and cloudflared.
      # ---------------------------------------------------------------
      - name: Install Xray-core and cloudflared
        run: |
          set -euo pipefail
          mkdir -p "$HOME/vpn" "$HOME/bin"

          bash scripts/download-binaries.sh "$HOME/bin" --xray-only
          bash scripts/download-cloudflared.sh "$HOME/bin"

          "$HOME/bin/xray" version
          "$HOME/bin/cloudflared" --version

      - name: Tune ephemeral connector buffers and TCP path recovery
        run: sudo bash scripts/tune-tunnel-runtime.sh

      # ---------------------------------------------------------------
      # 3. Start Xray (VLESS + WebSocket) and expose it via a Cloudflare
      #    quick tunnel. No ports opened on the runner - cloudflared dials
      #    out to Cloudflare's edge, and you connect to that edge hostname.
      # ---------------------------------------------------------------
      - name: Start Xray and Cloudflare tunnel
        env:
          RELAY_ENABLED: ${{ vars.RELAY_ENABLED || 'false' }}
          CF_TRANSPORT: ${{ vars.CF_TRANSPORT || 'auto' }}
          # Same-runner early-data checks passed but showed no consistent gain.
          # Keep the compatible baseline unless explicitly selected and verified.
          WS_EARLY_DATA: ${{ vars.WS_EARLY_DATA || 'false' }}
        run: |
          set -euo pipefail

          case "$CF_TRANSPORT" in auto|quic|http2) ;; *) echo 'Invalid CF_TRANSPORT'; exit 1;; esac
          UUID="$(cat /proc/sys/kernel/random/uuid)"
          WS_PATH="/$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          case "$RELAY_ENABLED" in
            true)
              # Public/shared profile identity: intentionally stable across runner rotations.
              mapfile -t PROFILE < <(python3 -c 'import json; p=json.load(open("worker/profile.json")); print(p["uuid"]); print(p["path"])')
              UUID="${PROFILE[0]}"
              WS_PATH="${PROFILE[1]}"
              ;;
            false) ;;
            *) echo 'Invalid RELAY_ENABLED'; exit 1 ;;
          esac
          PORT=18888

          # Same wire protocol and identities as Android; no extra relay.
          # IPv4-first cached origin DNS avoids repeated unusable IPv6 dials.
          python3 scripts/continuum_server.py --uuid "$UUID" --path "$WS_PATH" \
            --port "$PORT" --output "$HOME/vpn/config.json"

          "$HOME/bin/xray" run -test -c "$HOME/vpn/config.json"
          echo "Xray config OK."

          "$HOME/bin/xray" run -c "$HOME/vpn/config.json" > "$HOME/vpn/xray.log" 2>&1 &
          echo $! > "$HOME/vpn/xray.pid"

          "$HOME/bin/cloudflared" tunnel --protocol "$CF_TRANSPORT" --metrics 127.0.0.1:20241 --url "http://127.0.0.1:${PORT}" --no-autoupdate \
            > "$HOME/vpn/cloudflared.log" 2>&1 &
          echo $! > "$HOME/vpn/cloudflared.pid"

          URL=""
          for i in $(seq 1 90); do
            URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$HOME/vpn/cloudflared.log" | head -n 1 || true)"
            [ -n "$URL" ] && break
            if ! kill -0 "$(cat "$HOME/vpn/cloudflared.pid")" 2>/dev/null; then
              echo "::error::cloudflared exited early"
              tail -n 50 "$HOME/vpn/cloudflared.log"
              exit 1
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "::error::Tunnel URL never appeared"
            tail -n 50 "$HOME/vpn/cloudflared.log"
            exit 1
          fi

          HOST="${URL#https://}"
          {
            echo "UUID=${UUID}"
            echo "HOST=${HOST}"
            echo "WS_PATH=${WS_PATH}"
            echo "URL=${URL}"
          } > "$HOME/vpn/env"

          python3 scripts/check-tunnel.py "$HOST" "$UUID" "$WS_PATH" "$HOME/bin/xray" --early-data "$WS_EARLY_DATA"
          echo "Tunnel passed runner-side functional test: ${URL}"

      - name: Update stable Worker route and verify VLESS through it
        if: vars.RELAY_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          RELAY_UPDATE_TOKEN: ${{ secrets.RELAY_UPDATE_TOKEN }}
          WS_EARLY_DATA: ${{ vars.WS_EARLY_DATA || 'false' }}
        run: |
          set -euo pipefail
          . "$HOME/vpn/env"
          python3 scripts/update-relay.py "$HOST"
          RELAY_HOST="$(python3 -c 'import json; print(json.load(open("worker/profile.json"))["host"])')"
          # KV can serve the previous mapping for 60s or more at other locations.
          # This probe retries; failure prevents publication, not silently falling back.
          python3 scripts/check-tunnel.py "$RELAY_HOST" "$UUID" "$WS_PATH" "$HOME/bin/xray" --early-data "$WS_EARLY_DATA" --attempts 40
          echo "HOST=$RELAY_HOST" >> "$HOME/vpn/env"

      # ---------------------------------------------------------------
      # 4. Publish the v2rayNG config: clipboard URI + auto-refreshing
      #    subscription URL (release asset, overwritten every cycle).
      # ---------------------------------------------------------------
      - name: Publish v2rayNG config
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELAY_ENABLED: ${{ vars.RELAY_ENABLED || 'false' }}
          CF_TRANSPORT: ${{ vars.CF_TRANSPORT || 'auto' }}
          WS_EARLY_DATA: ${{ vars.WS_EARLY_DATA || 'false' }}
        run: |
          set -euo pipefail
          . "$HOME/vpn/env"

          EARLY_DATA_SUFFIX=""
          case "$WS_EARLY_DATA" in
            true) EARLY_DATA_SUFFIX='%3Fed%3D2048' ;;
            false) ;;
            *) echo 'Invalid WS_EARLY_DATA'; exit 1 ;;
          esac
          URI="vless://${UUID}@${HOST}:443?encryption=none&security=tls&sni=${HOST}&type=ws&host=${HOST}&path=%2F${WS_PATH#/}${EARLY_DATA_SUFFIX}#ArenaVPN"

          echo "VPN URI:"
          echo "${URI}"
          echo "::notice title=VPN config ready::${URI}"

          {
            echo "## VPN config for v2rayNG"
            echo "Connector transport: ${CF_TRANSPORT}; WS early data: ${WS_EARLY_DATA} (not a Tehran latency result)."
            echo
            echo "**Option A - import from clipboard** (v2rayNG: + -> Import from clipboard):"
            echo
            echo '```'
            echo "${URI}"
            echo '```'
            echo
            echo "**Option B - subscription (refresh in v2rayNG after rotation):**"
            echo
            echo '```'
            echo "https://github.com/${GH_REPO}/releases/download/vpn-config/config.txt"
            echo '```'
            echo
            echo "This tunnel lasts at most 5h25m. Handover interrupts active sessions."
            if [ "$RELAY_ENABLED" = true ]; then
              echo "Stable Worker profile: same hostname, UUID and path after rotation."
              echo "Existing sessions still disconnect; KV propagation can delay reconnection."
            else
              echo "Refresh the subscription after rotation (automatic refresh depends on client settings)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Subscription body = base64(vless URI), what v2rayNG expects.
          printf '%s' "${URI}" | base64 -w 0 > "$HOME/vpn/config.txt"
          gh release view vpn-config >/dev/null 2>&1 \
            || gh release create vpn-config \
                 --title "v2rayNG config (auto-updated)" \
                 --notes "Auto-generated every run by the VPN Loop workflow. Do not edit."
          gh release upload vpn-config "$HOME/vpn/config.txt" --clobber

      # ---------------------------------------------------------------
      # 5. Serve for 5h25m, then hand over to the queued run.
      #    (GitHub hard-kills jobs at 6h; we leave plenty of margin.)
      # ---------------------------------------------------------------
      - name: Serve (5h25m), then hand over
        run: |
          set -euo pipefail
          . "$HOME/vpn/env"
          echo "Serving ${URL} until $(date -u -d '+5h25m' '+%H:%M:%S UTC')..."
          deadline=$((SECONDS + 19500))
          while (( SECONDS < deadline )); do
            kill -0 "$(cat "$HOME/vpn/xray.pid")" || exit 1
            kill -0 "$(cat "$HOME/vpn/cloudflared.pid")" || exit 1
            sleep 30
          done
          echo "Handing over to the queued run."
          kill "$(cat "$HOME/vpn/xray.pid")" "$(cat "$HOME/vpn/cloudflared.pid")" 2>/dev/null || true
