name: VPN Loop

# Self-chaining VPN tunnel (Xray VLESS+WebSocket behind a Cloudflare quick tunnel).
#
# - workflow_dispatch : start the loop manually from the Actions tab
# - schedule          : safety net, revives the loop if the chain ever breaks
# - repository_dispatch (type: vpn-loop) : revive via API
#
# The FIRST step queues the next run. With the concurrency group below, that
# run sits "pending" until this one finishes (~5h25m), then takes over. Runs
# hand over to each other forever -> the tunnel effectively never dies.
#
# NOTE ON LATENCY FROM TEHRAN: this runs Xray on a GitHub-hosted runner in a US
# Azure region. Tehran -> US RTT alone is typically 150-250+ ms, so a sub-200 ms
# proxy RTT from Tehran is NOT plausible on this path no matter how the config is
# tuned. This is the free zero-cost option. For <200 ms you would need egress
# closer to Tehran (e.g. Istanbul/Frankfurt VPS), which this repo does not use.

on:
  workflow_dispatch:
  schedule:
    - cron: "21 */5 * * *"
  repository_dispatch:
    types: [vpn-loop]

permissions:
  actions: write
  contents: write

concurrency:
  group: vpn-loop
  # A repository_dispatch "kick" cancels whatever runs/pends and restarts the
  # loop fresh (emergency reset). All other events queue politely and take over
  # when the current run finishes -> the self-chaining handover.
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # ---------------------------------------------------------------
      # 1. Queue the NEXT run before anything else -> pending handover.
      # ---------------------------------------------------------------
      - name: Queue the next run (self-chaining loop)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run vpn.yml --ref "${{ github.event.repository.default_branch }}"; then
              echo "Next run queued (attempt ${attempt})."
              exit 0
            fi
            echo "Dispatch failed (attempt ${attempt}), retrying in 20s..."
            sleep 20
          done
          echo "::warning::Could not queue the next run; the cron schedule will revive the loop."

      # ---------------------------------------------------------------
      # 2. Install Xray-core and cloudflared.
      # ---------------------------------------------------------------
      - name: Install Xray-core and cloudflared
        run: |
          set -euo pipefail
          mkdir -p "$HOME/vpn" "$HOME/bin"

          echo "Downloading Xray-core..."
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo /tmp/xray.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/xray"

          echo "Downloading cloudflared..."
          curl -fsSL -o "$HOME/bin/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$HOME/bin/cloudflared"

          "$HOME/bin/xray" version
          "$HOME/bin/cloudflared" --version

      # ---------------------------------------------------------------
      # 3. Start Xray (VLESS + WebSocket) and expose it via a Cloudflare
      #    quick tunnel. No ports opened on the runner - cloudflared dials
      #    out to Cloudflare's edge, and you connect to that edge hostname.
      # ---------------------------------------------------------------
      - name: Start Xray and Cloudflare tunnel
        run: |
          set -euo pipefail

          UUID="$(cat /proc/sys/kernel/random/uuid)"
          WS_PATH="/$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          PORT=18888

          cat > "$HOME/vpn/config.json" <<JSON
          {
            "log": {"loglevel": "warning"},
            "inbounds": [{
              "listen": "127.0.0.1",
              "port": ${PORT},
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "${UUID}"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": {"path": "${WS_PATH}"}
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          JSON

          python3 -m json.tool "$HOME/vpn/config.json" > /dev/null
          echo "Xray config OK."

          "$HOME/bin/xray" run -c "$HOME/vpn/config.json" > "$HOME/vpn/xray.log" 2>&1 &
          echo $! > "$HOME/vpn/xray.pid"

          "$HOME/bin/cloudflared" tunnel --url "http://127.0.0.1:${PORT}" --no-autoupdate \
            > "$HOME/vpn/cloudflared.log" 2>&1 &
          echo $! > "$HOME/vpn/cloudflared.pid"

          URL=""
          for i in $(seq 1 90); do
            URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$HOME/vpn/cloudflared.log" | head -n 1 || true)"
            [ -n "$URL" ] && break
            if ! kill -0 "$(cat "$HOME/vpn/cloudflared.pid")" 2>/dev/null; then
              echo "::error::cloudflared exited early"
              tail -n 50 "$HOME/vpn/cloudflared.log"
              exit 1
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "::error::Tunnel URL never appeared"
            tail -n 50 "$HOME/vpn/cloudflared.log"
            exit 1
          fi

          HOST="${URL#https://}"
          {
            echo "UUID=${UUID}"
            echo "HOST=${HOST}"
            echo "WS_PATH=${WS_PATH}"
            echo "URL=${URL}"
          } > "$HOME/vpn/env"

          echo "Tunnel is live: ${URL}"

      # ---------------------------------------------------------------
      # 4. Publish the v2rayNG config: clipboard URI + auto-refreshing
      #    subscription URL (release asset, overwritten every cycle).
      # ---------------------------------------------------------------
      - name: Publish v2rayNG config
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . "$HOME/vpn/env"

          URI="vless://${UUID}@${HOST}:443?encryption=none&security=tls&sni=${HOST}&type=ws&host=${HOST}&path=%2F${WS_PATH#/}#ArenaVPN"

          echo "VPN URI:"
          echo "${URI}"
          echo "::notice title=VPN config ready::${URI}"

          {
            echo "## VPN config for v2rayNG"
            echo
            echo "**Option A - import from clipboard** (v2rayNG: + -> Import from clipboard):"
            echo
            echo '```'
            echo "${URI}"
            echo '```'
            echo
            echo "**Option B - subscription (auto-refreshes on every restart):**"
            echo
            echo '```'
            echo "https://github.com/${GH_REPO}/releases/download/vpn-config/config.txt"
            echo '```'
            echo
            echo "Current plain-text URI is also mirrored to"
            echo "\`https://raw.githubusercontent.com/${GH_REPO}/live-config/config.txt\`"
            echo
            echo "This tunnel serves traffic for **5h25m**, then the next queued run"
            echo "takes over with a fresh URL. Option B picks up the new URL"
            echo "automatically; with Option A re-copy this page's URI after each restart."
          } >> "$GITHUB_STEP_SUMMARY"

          # Subscription body = base64(vless URI), what v2rayNG expects.
          printf '%s' "${URI}" | base64 -w 0 > "$HOME/vpn/config.txt"
          gh release view vpn-config >/dev/null 2>&1 \
            || gh release create vpn-config \
                 --title "v2rayNG config (auto-updated)" \
                 --notes "Auto-generated every run by the VPN Loop workflow. Do not edit."
          gh release upload vpn-config "$HOME/vpn/config.txt" --clobber

      # ---------------------------------------------------------------
      # 4b. Mirror the plain-text config to the live-config branch
      #     (single commit, force-pushed each cycle - no history spam).
      #     Current URI: .../raw/live-config/config.txt
      # ---------------------------------------------------------------
      - name: Mirror config to live-config branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . "$HOME/vpn/env"
          URI="vless://${UUID}@${HOST}:443?encryption=none&security=tls&sni=${HOST}&type=ws&host=${HOST}&path=%2F${WS_PATH#/}#ArenaVPN"
          cd "$HOME/vpn"
          rm -rf mirror && mkdir mirror && cd mirror
          git init -q
          git config user.name "vpn-loop"
          git config user.email "vpn-loop@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git checkout -q -B live-config
          if git fetch -q --depth=1 origin live-config 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
          fi
          printf '%s\n' "${URI}" > config.txt
          git add config.txt
          git commit -q -m "config $(date -u +%FT%TZ)" || echo "no change"
          git push -q -f origin live-config
          echo "Mirrored to ${GH_REPO}@live-config:config.txt"

      # ---------------------------------------------------------------
      # 5. Serve for 5h25m, then hand over to the queued run.
      #    (GitHub hard-kills jobs at 6h; we leave plenty of margin.)
      # ---------------------------------------------------------------
      - name: Serve (5h25m), then hand over
        run: |
          set -euo pipefail
          . "$HOME/vpn/env"
          echo "Serving ${URL} until $(date -u -d '+5h25m' '+%H:%M:%S UTC')..."
          sleep 19500
          echo "Handing over to the queued run."
          kill "$(cat "$HOME/vpn/xray.pid")" "$(cat "$HOME/vpn/cloudflared.pid")" 2>/dev/null || true
