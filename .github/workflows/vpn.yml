name: Legacy VPN Loop (disabled on development branch)
# The original main-branch loop is not changed by this file. It self-chains,
# publishes plaintext credentials and force-pushes another branch. Do not run
# that behavior from this development branch.
on:
  push:
    branches: [arena/a78a10a4-my-small-project]
    paths: [.github/workflows/vpn.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          echo 'Disabled on this branch: no tunnel or self-chaining run started.'
