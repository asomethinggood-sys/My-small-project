name: Review exact universal candidate compatibility
on:
  push:
    branches: [arena/f056ce38-my-small-project]
    paths: [.github/workflows/compatibility-review.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read failed matrix logs without publishing private runtime material
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import subprocess
          for job in [129388251798,129388252119]:
              result=subprocess.run(['gh','run','view','42683224822','--job',str(job),'--log-failed'],capture_output=True,text=True,check=True)
              text='\n'.join(line for line in result.stdout.splitlines() if not any(word in line for word in ['Unzipping','Downloading','Fetching','Loading local','Loading remote','Computing updates']))[-3500:]
              print('::notice title=Compatibility job '+str(job)+'::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - name: Inspect saved installation and runtime diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          for variant in ['26-x86-google_apis','35-x86_64-google_apis_ps16k']:
              dest=pathlib.Path(variant)
              subprocess.run(['gh','run','download','42683224822','-n','compatibility-api-'+variant,'-D',str(dest)],check=True)
              for name in ['install.txt','page-size.txt','MainActivity.txt','crashes.txt','emulator.log']:
                  p=dest/name
                  text=p.read_text(errors='replace')[-3000:] if p.exists() else 'Not reached'
                  print('::notice title='+variant+' '+name+'::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
