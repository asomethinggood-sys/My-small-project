name: Bounded alternative-country candidate review
on:
  push:
    branches: [arena/f056ce38-my-small-project]
    paths: [.github/workflows/country-candidate-review.yml, scripts/egress_openvpn.py]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official directory without connecting or publishing profiles
        run: |
          python3 - <<'PY'
          import base64,csv,io,json,collections
          from scripts.egress_catalog import fetch_directory
          from scripts.egress_openvpn import sanitize
          targets=set(json.load(open('config/egress.json'))['target_countries'])
          text=fetch_directory();lines=text.splitlines()
          assert lines[0].strip()=='*vpn_servers' and lines[1].startswith('#HostName,')
          rows=csv.DictReader(io.StringIO('\n'.join([lines[1][1:]]+lines[2:])))
          counts={};rejections=collections.Counter();inspected=0
          for index,row in enumerate(rows):
              if index>=10000 or inspected>=100:break
              country=row.get('CountryShort','')
              if country not in targets or not row.get('OpenVPN_ConfigData_Base64'):continue
              count=counts.setdefault(country,{'advertised':0,'inspected':0,'sanitizer_accepted':0,'protocols':[]})
              count['advertised']+=1
              if count['inspected']>=5:continue
              count['inspected']+=1;inspected+=1
              try:
                  data=base64.b64decode(row['OpenVPN_ConfigData_Base64'],validate=True)
                  if len(data)>128*1024:raise ValueError('Configuration size rejected')
                  config=sanitize(data.decode('utf-8-sig'))
                  count['sanitizer_accepted']+=1
                  if config['transport'] not in count['protocols']:count['protocols'].append(config['transport'])
              except (ValueError,UnicodeError) as error:
                  rejections[str(error)]+=1
          print('::notice title=Alternative candidate counts (not working exits)::'+json.dumps(counts))
          print('::notice title=Sanitizer rejection categories::'+json.dumps(dict(rejections)))
          PY
