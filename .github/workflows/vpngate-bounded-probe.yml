name: Bounded VPNGate isolated connection test
# AEAD negotiation revision: modern AEAD choices, no CBC; allowlisted cipher diagnostics.
on:
  push:
    branches: [arena/a78a10a4-my-small-project]
    paths: [.github/workflows/vpngate-bounded-probe.yml, scripts/egress_vpngate.py]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[bounded-vpngate-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y openvpn iproute2 iptables curl
      - name: Test at most three official candidates without publishing a service
        run: sudo timeout --signal=TERM --kill-after=10s 330s python3 -m scripts.egress_vpngate
