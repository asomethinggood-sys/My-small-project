name: Bounded multi-provider discovery
on:
  push:
    branches: [arena/a78a10a4-my-small-project]
    paths:
      - .github/workflows/multi-provider-discovery.yml
      - scripts/egress_vpnjantit.py
      - scripts/egress_proton_inventory.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test provider parsers
        run: python3 -m unittest discover -s tests -p 'test_egress_*inventory.py' -v && python3 -m unittest discover -s tests -p 'test_egress_vpnjantit.py' -v
      - name: Inspect one VPN Jantit OpenVPN page without creating accounts
        id: jantit
        continue-on-error: true
        run: |
          timeout 60s python3 -m scripts.egress_catalog --vpnjantit-live --output .runtime/egress/jantit-catalog.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.runtime/egress/jantit-catalog.json').read_text())
          for r in c['countries']:
              if r['discovered_servers']:
                  print('::notice title=VPN Jantit snapshot '+r['country']+'::'+str(r['discovered_servers'])+' unique advertised OpenVPN hosts; zero verified exits')
          print('::notice title=VPN Jantit total::'+str(len(c['observations']))+' unique target-country hosts; not verified or usable')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vpnjantit-catalog-${{ github.run_id }}
          path: .runtime/egress/jantit-catalog.json
          retention-days: 3
      - name: Inspect one Proton directory response without credentials
        continue-on-error: true
        run: timeout 60s python3 -m scripts.egress_proton_inventory
      - name: Mark VPN Jantit discovery failure
        if: steps.jantit.outcome == 'failure'
        run: exit 1
