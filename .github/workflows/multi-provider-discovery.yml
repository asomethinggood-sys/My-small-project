name: Bounded multi-provider discovery
on:
  push:
    branches: [arena/a78a10a4-my-small-project]
    paths:
      - .github/workflows/multi-provider-discovery.yml
      - scripts/egress_vpnjantit.py
      - scripts/egress_proton_inventory.py
      - scripts/egress_catalog.py
      - scripts/egress_refresh.py
      - tests/test_egress_refresh.py
  workflow_dispatch:
  # GitHub only runs schedules on the default branch; on this branch it is inert.
  # This is a bounded diagnostic, not a hosted VPN or live production feed.
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: nyx-provider-discovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  directory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test provider parsers
        run: python3 -m unittest discover -s tests -p 'test_egress_*inventory.py' -v && python3 -m unittest discover -s tests -p 'test_egress_vpnjantit.py' -v && python3 -m unittest discover -s tests -p 'test_egress_refresh.py' -v && python3 -m unittest discover -s tests -p 'test_egress_path_probe.py' -v
      - name: Exercise two bounded refresh cycles without creating accounts
        id: discovery
        continue-on-error: true
        run: |
          status=0
          timeout 140s python3 -m scripts.egress_refresh --interval 60 --duration 65 --output .runtime/egress/jantit-catalog.json | tee "$RUNNER_TEMP/nyx-refresh.log" || status=$?
          attempts=$(grep -c '^catalog refresh:' "$RUNNER_TEMP/nyx-refresh.log" || true)
          echo "::notice title=Refresh cycles::$attempts bounded cycles attempted"
          if [ "$attempts" != 2 ]; then status=1; fi
          if [ -f .runtime/egress/jantit-catalog.json ]; then
            python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          c=json.loads(Path('.runtime/egress/jantit-catalog.json').read_text())
          print('::notice title=Source status::'+json.dumps(c['sources']))
          for provider in ('vpngate','vpnjantit'):
              rows=[r for r in c['observations'] if r['provider']==provider]
              counts=dict(Counter(r['country'] for r in rows))
              print(f'::notice title={provider} snapshot::{len(rows)} distinct provider endpoints in {len(counts)} target countries; {sum(r.get("advertised_tcp_udp",False) for r in rows)} claim TCP and UDP; none verified; '+json.dumps(counts,sort_keys=True))
          PY
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: vpnjantit-catalog-${{ github.run_id }}
          path: .runtime/egress/jantit-catalog.json
          retention-days: 3
      - name: Mark partial discovery failure
        if: steps.discovery.outcome == 'failure'
        run: exit 1
