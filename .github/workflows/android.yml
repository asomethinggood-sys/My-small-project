name: Android client
on:
  push:
    paths: [android/**, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch checksum-pinned Xray engine
        run: bash android/scripts/fetch-core.sh
      - name: Rust tests, JNI boundary tests, JVM tests, lint and emulator APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon -PtargetAbi=x86_64 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build-log.txt
      - name: Configure private stable signing if provisioned
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/f056ce38-my-small-project'
        env:
          CONTINUUM_SIGNING_KEY_B64: ${{ secrets.CONTINUUM_SIGNING_KEY_B64 }}
          CONTINUUM_STORE_PASSWORD: ${{ secrets.CONTINUUM_STORE_PASSWORD }}
          CONTINUUM_KEY_ALIAS: ${{ secrets.CONTINUUM_KEY_ALIAS }}
          CONTINUUM_KEY_PASSWORD: ${{ secrets.CONTINUUM_KEY_PASSWORD }}
        run: python3 android/scripts/configure-signing.py
      - name: Build compressed ARM64 release APK
        working-directory: android
        run: |
          gradle --no-daemon -PtargetAbi=arm64-v8a :app:assembleRelease :app:lintRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/continuum-0.4.0-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/continuum-0.4.0-arm64.apk > release/SIGNING-CERTIFICATE.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, os
          p=Path('release/continuum-0.4.0-arm64.apk')
          with zipfile.ZipFile(p) as z:
              native=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert 'lib/arm64-v8a/libcontinuum_core.so' in native
              assert native and all(n.startswith('lib/arm64-v8a/') for n in native),native
              assert all(z.getinfo(n).compress_type==zipfile.ZIP_DEFLATED for n in native)
          size=p.stat().st_size
          mode='provisioned key' if os.environ.get('CONTINUUM_KEYSTORE_PATH') else 'disposable preview key; stable signing NOT configured'
          text=f'ARM64 APK: {size:,} bytes ({size/1000000:.2f} MB; {size/1048576:.2f} MiB).\nSHA256: {hashlib.sha256(p.read_bytes()).hexdigest()}\nSigning: {mode}\n'
          print('::notice title=APK size and signing::'+text.replace('\n','%0A'))
          Path('release/APK-SIZE.txt').write_text(text)
          PY
      - name: Temporary protocol and website compatibility fixtures
        run: |
          python3 -u android/scripts/vpn-fixture.py > "$RUNNER_TEMP/fixture.log" 2>&1 &
          fixture_pid=$!
          for attempt in $(seq 1 150); do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat "$RUNNER_TEMP/fixture.log"; exit 1; fi
            if grep -q FIXTURE_READY "$RUNNER_TEMP/fixture.log"; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fixture.log"
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real TUN DNS, HTTP, HTTPS, transfers, UDP and lifecycle regressions
        run: |
          set -o pipefail
          bash android/scripts/emulator-session.sh 2>&1 | tee android/emulator-boot.log
      - name: Corresponding source and licenses
        run: |
          git archive --format=tar.gz --output=android/release/continuum-source.tar.gz HEAD android
          cp android/THIRD_PARTY.md android/LICENSE* android/release/
          cp android/third-party/libv2ray-sources.jar android/release/
          cp android/network-report.txt android/release/
      - name: Upload full staged-migration APK after successful tests
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/f056ce38-my-small-project'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="continuum-0.4.0-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" android/release/* --target "$GITHUB_SHA" --prerelease --title "Continuum 0.4 · Rust migration stage 1 · build ${GITHUB_RUN_NUMBER}" --notes "Android 8+ ARM64. Rust scheduling, cancellation-token, backoff and diagnostic policy through JNI; conditional subscriptions; default-network monitoring; local redacted reports. This is NOT a completed Rust migration: Java profile/config parsing and Android orchestration remain; Xray remains Go by design. Stable signing requires privately provisioned Actions secrets; APK-SIZE.txt states the actual mode. Existing previews may require uninstall. Rust/JVM tests and real API35 x86_64 TUN regressions pass; physical ARM, real mobile handoff, battery and latency improvements remain unverified."
      - name: Failure diagnostics
        if: failure()
        run: python3 android/scripts/ci-diagnostics.py
      - name: Reports and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-${{ github.run_number }}
          retention-days: 7
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/build-log.txt
            android/emulator-log.txt
            android/emulator-boot.log
            android/emulator-runtime.log
            android/device-crash.txt
            android/network-report.txt
            android/continuum-screen.png
            android/release/APK-SIZE.txt
            android/release/SIGNING-CERTIFICATE.txt
