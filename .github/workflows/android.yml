name: Android client
on:
  push:
    paths: [android/**, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch checksum-pinned native engine
        run: bash android/scripts/fetch-core.sh
      - name: Unit tests, lint and emulator APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon -PtargetAbi=x86_64 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build-log.txt
      - name: Build compressed ARM64 release APK
        working-directory: android
        run: |
          gradle --no-daemon -PtargetAbi=arm64-v8a :app:assembleRelease :app:lintRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/continuum-0.2.0-arm64.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          p=Path('release/continuum-0.2.0-arm64.apk')
          with zipfile.ZipFile(p) as z:
              native=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert native and all(n.startswith('lib/arm64-v8a/') for n in native),native
              assert all(z.getinfo(n).compress_type==zipfile.ZIP_DEFLATED for n in native)
          size=p.stat().st_size
          text=f'ARM64 APK: {size:,} bytes ({size/1000000:.2f} MB; {size/1048576:.2f} MiB).\nSHA256: {hashlib.sha256(p.read_bytes()).hexdigest()}\n'
          print(text)
          Path('release/APK-SIZE.txt').write_text(text)
          PY
      - name: Temporary protocol fixtures (never production configuration)
        run: |
          python3 -u android/scripts/vpn-fixture.py > "$RUNNER_TEMP/fixture.log" 2>&1 &
          fixture_pid=$!
          for attempt in $(seq 1 150); do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat "$RUNNER_TEMP/fixture.log"; exit 1; fi
            if grep -q FIXTURE_READY "$RUNNER_TEMP/fixture.log"; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fixture.log"
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android TUN traffic, all protocols, bound-service disconnect and cancelled-fetch reconnect
        run: |
          set -o pipefail
          bash android/scripts/emulator-session.sh 2>&1 | tee android/emulator-boot.log
      - name: Corresponding source and licenses
        run: |
          git archive --format=tar.gz --output=android/release/continuum-source.tar.gz HEAD android
          cp android/THIRD_PARTY.md android/LICENSE* android/release/
          cp android/third-party/libv2ray-sources.jar android/release/
      - name: Upload full APK as a public prerelease asset (not an artifact ZIP)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/f056ce38-my-small-project'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="continuum-0.2.0-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" android/release/* --target "$GITHUB_SHA" --prerelease --title "Continuum 0.2 preview · ARM64 · build ${GITHUB_RUN_NUMBER}" --notes "Standalone Android 8+ ARM64 APK. Explicit disconnect, isolated VPN process and additional imported protocols. Automated tests cover a separate app UID through Android TUN on API 35 x86_64; this is not physical ARM/Tehran or 24-hour validation. Preview certificate: uninstall previous builds if signature differs (removes saved settings). APK size and SHA256 are in APK-SIZE.txt. Installed footprint is larger than compressed download. Source and license references attached."
      - name: Reports and size measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-${{ github.run_number }}
          retention-days: 7
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/build-log.txt
            android/emulator-log.txt
            android/emulator-boot.log
            android/emulator-runtime.log
            android/device-crash.txt
            android/continuum-screen.png
            android/release/APK-SIZE.txt
