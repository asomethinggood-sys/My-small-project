name: Android client
on:
  push:
    paths:
      - android/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 35 on the hosted runner SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch checksum-pinned native VPN engine
        run: bash android/scripts/fetch-core.sh
      - name: Build real APK, unit tests and lint
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug > build-log.txt 2>&1; then
            find app/build/intermediates/lint_intermediate_text_report -name '*.txt' -exec cat {} \; >> build-log.txt 2>/dev/null || true
            cat build-log.txt
            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report=Path('app/build/reports/lint-results-debug.xml')
          if report.exists():
              for issue in ET.parse(report).getroot().iter('issue'):
                  if issue.get('severity') in ('Error','Fatal'):
                      message=issue.get('message','').replace('%','%25').replace('\n','%0A')
                      print('::error title=Lint '+issue.get('id','')+'::'+message)
          text=Path('build-log.txt').read_text()[-18000:]
          print('::error title=Android build diagnostics::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
            exit 1
          fi
          cat build-log.txt
      - name: Package exact app source for this build
        run: git archive --format=tar.gz --output=android/continuum-source.tar.gz HEAD android
      - name: APK and corresponding source/license references
        uses: actions/upload-artifact@v4
        with:
          name: continuum-debug-${{ github.run_number }}
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/third-party/libv2ray-sources.jar
            android/THIRD_PARTY.md
            android/LICENSE*
            android/README.md
            android/continuum-source.tar.gz
      - name: Enable KVM for the Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 native engine and screen smoke tests (not Tehran)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/scripts/device-smoke.sh
      - name: Android screen capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuum-screen-${{ github.run_number }}
          path: android/continuum-screen.png
          retention-days: 7
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          retention-days: 7
          path: |
            android/app/build/reports/
            android/build-log.txt
            android/emulator-log.txt
            android/app/build/outputs/androidTest-results/
