name: Android client
on:
  push:
    paths:
      - android/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch checksum-pinned native VPN engine
        run: bash android/scripts/fetch-core.sh
      - name: Build real APK, unit tests and lint
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug > build-log.txt 2>&1; then
            cat build-log.txt
            python3 - <<'PY'
          from pathlib import Path
          text=Path('build-log.txt').read_text()[-18000:]
          print('::error title=Android build diagnostics::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
            exit 1
          fi
          cat build-log.txt
      - name: Package exact app source for this build
        run: git archive --format=tar.gz --output=android/continuum-source.tar.gz HEAD android
      - name: APK and corresponding source/license references
        uses: actions/upload-artifact@v4
        with:
          name: continuum-debug-${{ github.run_number }}
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/third-party/libv2ray-sources.jar
            android/THIRD_PARTY.md
            android/LICENSE*
            android/README.md
            android/continuum-source.tar.gz
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.run_number }}
          retention-days: 7
          path: |
            android/app/build/reports/
            android/build-log.txt
