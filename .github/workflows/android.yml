name: Android client
on:
  push:
    paths: [android/**, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch checksum-pinned native engine
        run: bash android/scripts/fetch-core.sh
      - name: Unit tests, lint and emulator APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon -PtargetAbi=x86_64 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee build-log.txt
      - name: Build compressed ARM64 release APK
        working-directory: android
        run: |
          gradle --no-daemon -PtargetAbi=arm64-v8a :app:assembleRelease :app:lintRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/continuum-0.3.0-arm64.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          p=Path('release/continuum-0.3.0-arm64.apk')
          with zipfile.ZipFile(p) as z:
              native=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert native and all(n.startswith('lib/arm64-v8a/') for n in native),native
              assert all(z.getinfo(n).compress_type==zipfile.ZIP_DEFLATED for n in native)
          size=p.stat().st_size
          text=f'ARM64 APK: {size:,} bytes ({size/1000000:.2f} MB; {size/1048576:.2f} MiB).\nSHA256: {hashlib.sha256(p.read_bytes()).hexdigest()}\n'
          print('::notice title=APK size::'+text.replace('\n','%0A'))
          Path('release/APK-SIZE.txt').write_text(text)
          PY
      - name: Temporary protocol and website compatibility fixtures
        run: |
          python3 -u android/scripts/vpn-fixture.py > "$RUNNER_TEMP/fixture.log" 2>&1 &
          fixture_pid=$!
          for attempt in $(seq 1 150); do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat "$RUNNER_TEMP/fixture.log"; exit 1; fi
            if grep -q FIXTURE_READY "$RUNNER_TEMP/fixture.log"; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fixture.log"
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real TUN DNS, HTTP, HTTPS, uploads, downloads, UDP and disconnect tests
        run: |
          set -o pipefail
          bash android/scripts/emulator-session.sh 2>&1 | tee android/emulator-boot.log
      - name: Corresponding source and licenses
        run: |
          git archive --format=tar.gz --output=android/release/continuum-source.tar.gz HEAD android
          cp android/THIRD_PARTY.md android/LICENSE* android/release/
          cp android/third-party/libv2ray-sources.jar android/release/
          cp android/network-report.txt android/release/
      - name: Upload complete APK only after successful tests
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/f056ce38-my-small-project'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="continuum-0.3.0-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" android/release/* --target "$GITHUB_SHA" --prerelease --title "Continuum 0.3 preview · ARM64 · build ${GITHUB_RUN_NUMBER}" --notes "Android 8+ ARM64. Proxied cached DoH, IPv4-answer compatibility default, HTTP/TLS hostname recovery, MTU settings and reduced idle checks. Real TUN tests cover DNS with server port 53 blocked, four protocols, website HTTPS, Host recovery, large upload/download, UDP and disconnect on API 35 x86_64. No physical ARM/Tehran latency, battery savings or long-duration claim. See network-report.txt for runner-only timings. Preview signer: previous builds may need uninstall, deleting settings. APK size/hash, exact application source and license references attached. Production subscription unchanged."
      - name: Failure diagnostics
        if: failure()
        run: python3 android/scripts/ci-diagnostics.py
      - name: Reports and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-${{ github.run_number }}
          retention-days: 7
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/build-log.txt
            android/emulator-log.txt
            android/emulator-boot.log
            android/emulator-runtime.log
            android/device-crash.txt
            android/network-report.txt
            android/continuum-screen.png
            android/release/APK-SIZE.txt
