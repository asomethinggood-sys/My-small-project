name: Bounded trial failure diagnosis
on:
  push:
    branches: [arena/f056ce38-my-small-project]
    paths: [.github/workflows/trial-diagnostics.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover failed startup tail
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import subprocess,re
          log=subprocess.run(['gh','run','view','42704810693','--job','129458841049','--log-failed'],capture_output=True,text=True,check=True).stdout[-3500:]
          log=re.sub(r'https?://\S+','[redacted URL]',log)
          print('::notice title=Trial startup diagnostics::'+log.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
