name: Nyx published APK install audit
on:
  push:
    branches: [arena/a78a10a4-my-small-project]
    paths: [.github/workflows/nyx-install-audit.yml, android/scripts/install-audit.sh]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch the exact published APK, not a rebuilt debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime/install-audit
          gh release download nyx-0.5.0-preview-21 --pattern nyx-0.5.0-arm64.apk --dir .runtime/install-audit
          echo '01b94c200b371e6763dd3b9a3100f6770708f6b71dccc4b7304678eae5954895  .runtime/install-audit/nyx-0.5.0-arm64.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Audit signatures, manifest and real package-manager installation
        env:
          AUDIT_API: ${{ matrix.api }}
        run: bash android/scripts/install-audit.sh
      - name: Summarize audit independently of SDK output
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('.runtime/install-audit')
          for name in ['install.txt','native-abi-check.txt','signature.txt','manifest.txt','emulator.log']:
            p=d/name
            text=p.read_text(errors='replace')[-2500:] if p.exists() else 'Not reached'
            print('::notice title=Audit '+name+'::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyx-install-audit-api-${{ matrix.api }}
          retention-days: 7
          path: |
            .runtime/install-audit/*.txt
            .runtime/install-audit/*.log
