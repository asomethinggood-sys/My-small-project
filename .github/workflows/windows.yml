name: Continuum Windows
on:
  push:
    branches: [arena/f056ce38-my-small-project]
    paths: [windows/**, .github/workflows/windows.yml]
permissions:
  contents: read
concurrency:
  group: continuum-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: a4a3dff5b20c2faae567b742c172c7b95e75c083
          path: engine-source
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-source/go.mod
          cache-dependency-path: engine-source/go.sum
      - name: Build Rust x64 client and tests
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          cargo test --manifest-path windows/native/Cargo.toml 2>&1 | Tee-Object -FilePath rust-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content rust-build.log -Tail 50 | ForEach-Object { Write-Output "::error::$_" }; exit 1 }
          cargo build --release --manifest-path windows/native/Cargo.toml 2>&1 | Tee-Object -FilePath rust-release.log
          if ($LASTEXITCODE -ne 0) { Get-Content rust-release.log -Tail 50 | ForEach-Object { Write-Output "::error::$_" }; exit 1 }
          New-Item -ItemType Directory -Force package-x64/engine,package-x64/notices | Out-Null
          Copy-Item windows/native/target/release/Continuum.exe,windows/native/target/release/validate.exe package-x64
          $mt = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/mt.exe' | Sort-Object FullName | Select-Object -Last 1
          & $mt.FullName -nologo -manifest windows/Continuum/app.manifest '-outputresource:package-x64/Continuum.exe;#1'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest embedding failed' }
          $dumpbin = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/2022/*/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe' | Sort-Object FullName | Select-Object -Last 1
          if (!$dumpbin) { throw 'Dependency auditor unavailable' }
          $imports = & $dumpbin.FullName /dependents package-x64/Continuum.exe
          if ($LASTEXITCODE -ne 0 -or ($imports -join "`n") -match '(?i)(VCRUNTIME|MSVCP|WebView|hostfxr|coreclr).*dll') { throw 'Unexpected external app runtime dependency' }
          Write-Output '::notice title=Standalone runtime audit::Static MSVC runtime; no VC redistributable, .NET or WebView dependency'
      - name: Native desktop launch gate
        run: |
          $app = Start-Process (Resolve-Path package-x64/Continuum.exe).Path -PassThru
          Start-Sleep 4
          $app.Refresh()
          Write-Output "::notice title=Desktop startup::exited=$($app.HasExited) exit=$($app.ExitCode) title=$($app.MainWindowTitle) handle=$($app.MainWindowHandle)"
          if ($app.HasExited -or $app.MainWindowTitle -ne 'Continuum') { if (!$app.HasExited) { Stop-Process -Id $app.Id }; throw 'Desktop launch failed' }
          ./windows/scripts/ui-audit.ps1 -Window $app.MainWindowHandle
          $app.CloseMainWindow() | Out-Null
          if (!$app.WaitForExit(20000)) { Stop-Process -Id $app.Id; throw 'Desktop close timed out' }
      - name: Build limited engine and collect runtime notices
        run: |
          ./windows/scripts/fetch-engine.ps1 -Architecture x64 -Destination package-x64/engine
          Copy-Item windows/native/engine-imports.go engine-source/main/distro/all/all.go -Force
          $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'
          Push-Location engine-source
          go build -trimpath -ldflags='-s -w' -o ../package-x64/engine/xray.exe ./main
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'Engine build failed' }
          Pop-Location
          Copy-Item windows/native/README.txt,windows/native/THIRD_PARTY.md package-x64
          cargo metadata --manifest-path windows/native/Cargo.toml --format-version 1 > dependencies.json
          $meta = Get-Content dependencies.json -Raw | ConvertFrom-Json
          $meta.packages | Select-Object name,version,license,source | ConvertTo-Json -Depth 6 | Set-Content package-x64/notices/rust-dependencies.json
          foreach ($p in $meta.packages) {
            $dir = Split-Path $p.manifest_path
            $dest = "package-x64/notices/$($p.name)-$($p.version)"
            New-Item -ItemType Directory -Force $dest | Out-Null
            Get-ChildItem $dir -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE)' } | Copy-Item -Destination $dest
          }
          Invoke-WebRequest https://raw.githubusercontent.com/rust-lang/rust/stable/LICENSE-MIT -OutFile package-x64/notices/LICENSE-RUST-MIT
          Invoke-WebRequest https://raw.githubusercontent.com/rust-lang/rust/stable/LICENSE-APACHE -OutFile package-x64/notices/LICENSE-RUST-APACHE
      - name: Actual Windows tunnel, six-minute voice transport and media checks
        run: ./windows/scripts/smoke.ps1 -AppDirectory package-x64 -NativeApp
      - name: Package x64 only with hard 20 MB download gate
        run: |
          Remove-Item package-x64/validate.exe
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path package-x64/* -DestinationPath release/Continuum-0.3.0-windows-x64.zip -CompressionLevel Optimal
          $size = (Get-Item release/Continuum-0.3.0-windows-x64.zip).Length
          Write-Output "::notice title=Complete standalone download::$size bytes (decimal 20 MB limit)"
          if ($size -ge 20000000) { throw 'Complete package exceeds 20 MB; do not publish' }
          git archive --format=tar --output=app-source.tar HEAD windows .github/workflows/windows.yml
          New-Item -ItemType Directory -Force source-bundle | Out-Null
          tar -xf app-source.tar -C source-bundle
          Copy-Item windows/native/Cargo.lock source-bundle/windows/native/
          Copy-Item engine-source source-bundle/engine-source -Recurse
          Remove-Item source-bundle/engine-source/.git -Recurse -Force
          tar -czf release/Continuum-0.3.0-corresponding-source.tar.gz -C source-bundle .
          Copy-Item windows/native/Cargo.lock release/Cargo.lock
          Get-ChildItem release/* | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: |
            windows-desktop.png
            fixture/*.log
            rust-build.log
            rust-release.log
      - uses: actions/upload-artifact@v4
        with:
          name: Continuum-Windows
          path: release/*
      - name: Publish validated x64 download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "continuum-windows-0.3.0-${{ github.run_number }}" release/* --target '${{ github.sha }}' --prerelease --title 'Continuum 0.3 — native Rust desktop, Windows x64' --notes 'Standalone x64-only Rust/Win32 desktop with a hard complete-download size gate under 20,000,000 bytes. No .NET/WebView runtime downloads. Managed UI has no repository/source/profile controls. Pins active sessions during healthy subscription updates; failed probes alone do not restart the same peer. Preserves CDN IP destinations; uses TCP video fallback instead of UDP/443 and longer voice session idle budgets. Protocol engine remains a limited Go Xray build, not all-Rust. Actual Windows TUN, 6-minute UDP and byte-exact segmented media regression tests passed; not a guarantee of Discord or YouTube service access on every exit. Extract the entire ZIP; run Continuum.exe as administrator. Unsigned preview, not a permanent kill switch. Source and license notices accompany release.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
