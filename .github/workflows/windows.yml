name: Continuum Windows
on:
  push:
    branches: [arena/f056ce38-my-small-project]
    paths: [windows/**, .github/workflows/windows.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuum-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit and policy tests
        run: |
          dotnet run --project windows/Tests/Tests.csproj -c Release 2>&1 | Tee-Object -Variable testLog
          if ($LASTEXITCODE -ne 0) {
            $detail = (($testLog | Select-Object -Last 15) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows test failure::$detail"
            exit 1
          }
      - name: Publish self-contained x64 and ARM64 packages
        run: |
          foreach ($arch in @('x64','arm64')) {
            dotnet publish windows/Continuum/Continuum.csproj -c Release -r "win-$arch" --self-contained true -p:DebugType=None -p:DebugSymbols=false -o "package-$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./windows/scripts/fetch-engine.ps1 -Architecture $arch -Destination "package-$arch/engine"
            Copy-Item windows/README.md,windows/THIRD_PARTY.md "package-$arch"
            Invoke-WebRequest https://raw.githubusercontent.com/dotnet/runtime/v8.0.0/LICENSE.TXT -OutFile "package-$arch/LICENSE-DOTNET.TXT"
            Invoke-WebRequest https://raw.githubusercontent.com/dotnet/runtime/v8.0.0/THIRD-PARTY-NOTICES.TXT -OutFile "package-$arch/THIRD-PARTY-NOTICES-DOTNET.TXT"
          }
      - name: Real engine, Windows scoped TUN, UDP and desktop smoke tests
        run: ./windows/scripts/smoke.ps1 -AppDirectory package-x64
      - name: Package downloads and hashes
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          foreach ($arch in @('x64','arm64')) {
            Compress-Archive -Path "package-$arch/*" -DestinationPath "release/Continuum-0.1.0-windows-$arch.zip"
          }
          Get-ChildItem release/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
          Get-ChildItem release/*.zip | ForEach-Object { Write-Output "::notice title=Package size::$($_.Name): $($_.Length) bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: Continuum-Windows
          path: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: |
            windows-desktop.png
            fixture/*.log
      - name: Publish Windows preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "continuum-windows-0.1.0-${{ github.run_number }}"
          gh release create $tag release/* --target '${{ github.sha }}' --prerelease --title 'Continuum 0.1 for Windows — x64 and ARM64' --notes 'Normal Continuum desktop client. Extract the entire ZIP and run Continuum.exe as administrator. X64 has Windows Server runner unit, local TUN TCP/UDP and desktop smoke evidence; physical Windows 10/11 and ARM64 acceptance remain unverified. Unsigned app; signature-checked Wintun. Not an always-on kill switch. See bundled README for scope and limitations.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
