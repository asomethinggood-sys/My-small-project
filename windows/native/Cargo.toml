[package]
name = "continuum-desktop"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "Continuum"
path = "src/main.rs"

[[bin]]
name = "validate"
path = "src/validate.rs"

[dependencies]
serde_json = "=1.0.145"
base64 = "=0.22.1"
url = "=2.5.7"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "native-tls"] }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
