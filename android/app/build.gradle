plugins { id 'com.android.application' }
android {
    namespace 'app.continuum'
    compileSdk 35
    defaultConfig {
        applicationId 'app.continuum'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-preview'
        ndk { abiFilters.add(providers.gradleProperty('targetAbi').getOrElse('arm64-v8a')) }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'BUILD_ABI', '"' + providers.gradleProperty('targetAbi').getOrElse('arm64-v8a') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Preview signer only. A private stable release key is required for future in-place updates.
            signingConfig signingConfigs.debug
        }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('libs/libv2ray.aar')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
