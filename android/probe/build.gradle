// Test-only second UID: never packaged in or released with the VPN app.
plugins { id 'com.android.application' }
android {
    namespace 'app.continuum.probe'
    compileSdk 35
    defaultConfig { applicationId 'app.continuum.probe'; minSdk 26; targetSdk 35; versionCode 1; versionName 'test-only' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
